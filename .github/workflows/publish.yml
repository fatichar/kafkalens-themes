name: Publish to Plugin Index

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="dev-$(git rev-parse --short HEAD)"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
    - name: Create release zips
      run: |
        python3 - <<'PY'
        import os
        import zipfile

        archives = [
            "nature-themes-${{ steps.version.outputs.VERSION }}.zip",
            "nature-themes-latest.zip",
        ]
        excluded_files = {"README.md", "install.sh", "install.bat"}

        files = []
        for root, directories, names in os.walk("."):
            directories[:] = [directory for directory in directories if directory != ".git"]
            for name in names:
                if name in excluded_files:
                    continue
                source = os.path.join(root, name)
                archive_name = os.path.relpath(source, ".").replace(os.sep, "/")
                files.append((source, archive_name))

        for archive in archives:
            with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as output:
                for source, archive_name in files:
                    output.write(source, archive_name)
        PY

        for archive in nature-themes-${{ steps.version.outputs.VERSION }}.zip nature-themes-latest.zip; do
          if zipinfo -1 "$archive" | grep -Fq '\'; then
            echo "Archive contains Windows-style path separators: $archive"
            zipinfo -1 "$archive"
            exit 1
          fi
        done
        
        echo "📦 Created ZIPs:"
        echo "   - nature-themes-${{ steps.version.outputs.VERSION }}.zip (versioned)"
        echo "   - nature-themes-latest.zip (consistent)"
        
    - name: Upload versioned ZIP as artifact
      uses: actions/upload-artifact@v4
      with:
        name: nature-themes-${{ steps.version.outputs.VERSION }}
        path: ./nature-themes-${{ steps.version.outputs.VERSION }}.zip
        retention-days: 30
        
    - name: Upload latest ZIP as artifact
      uses: actions/upload-artifact@v4
      with:
        name: nature-themes-latest
        path: ./nature-themes-latest.zip
        retention-days: 30

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          nature-themes-${{ steps.version.outputs.VERSION }}.zip
          nature-themes-latest.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
