name: Publish to Plugin Index

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="dev-$(git rev-parse --short HEAD)"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
    - name: Create release zips
      run: |
        # Create versioned zip for artifacts
        zip -r nature-themes-${{ steps.version.outputs.VERSION }}.zip . -x ".git/*" "README.md" "install.sh" "install.bat"
        
        # Create consistent latest zip for releases
        zip -r nature-themes-latest.zip . -x ".git/*" "README.md" "install.sh" "install.bat"
        
        echo "📦 Created ZIPs:"
        echo "   - nature-themes-${{ steps.version.outputs.VERSION }}.zip (versioned)"
        echo "   - nature-themes-latest.zip (consistent)"
        
    - name: Upload versioned ZIP as artifact
      uses: actions/upload-artifact@v4
      with:
        name: nature-themes-${{ steps.version.outputs.VERSION }}
        path: ./nature-themes-${{ steps.version.outputs.VERSION }}.zip
        retention-days: 30
        
    - name: Upload latest ZIP as artifact
      uses: actions/upload-artifact@v4
      with:
        name: nature-themes-latest
        path: ./nature-themes-latest.zip
        retention-days: 30

    - name: Upload to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: |
          nature-themes-${{ steps.version.outputs.VERSION }}.zip
          nature-themes-latest.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
