name: Publish to Plugin Index

on:
  push:
    tags:
      - 'v*'
    branches:
      - master
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Get version
      id: version
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION="dev-$(git rev-parse --short HEAD)"
        fi
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
    - name: Create release zip
      run: |
        zip -r nature-themes-${{ steps.version.outputs.VERSION }}.zip . -x ".git/*" "README.md" "install.sh" "install.bat"
        echo "📦 Created ZIP: nature-themes-${{ steps.version.outputs.VERSION }}.zip"
        echo "🔗 To update plugin index, edit kafkalens-plugin-index/plugins.json"
        echo "📝 Set version: ${{ steps.version.outputs.VERSION }}"
        echo "⏰ Set updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        
    - name: Upload release asset
      if: github.event_name == 'release'
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./nature-themes-${{ steps.version.outputs.VERSION }}.zip
        asset_name: nature-themes-${{ steps.version.outputs.VERSION }}.zip
        asset_content_type: application/zip
